limit_req_zone $binary_remote_addr zone=admin_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=merchant_api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=auth_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=registration_api:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=download_api:10m rate=10r/s;
log_format epay_no_query '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';

map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/security-headers-http.conf;

    client_max_body_size 120m;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(?:prod-api/)?api/v1/public/merchant-accounts/ {
        limit_req zone=registration_api burst=5 nodelay;
        rewrite ^/prod-api/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location ~ ^/(?:prod-api/)?api/v1/public/app-releases/ {
        limit_req zone=download_api burst=20 nodelay;
        rewrite ^/prod-api/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_buffering off;
    }

    location ~ ^/(?:prod-api/)?auth/(?:login|step-up/totp) {
        limit_req zone=auth_api burst=10 nodelay;
        rewrite ^/prod-api/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location ^~ /prod-api/payment/app-releases {
        client_max_body_size 150m;
        limit_req zone=admin_api burst=10 nodelay;
        rewrite ^/prod-api/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location /api/v1/merchant/ {
        limit_req zone=merchant_api burst=30 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location ~ ^/(?:submit|mapi|api)\.php$ {
        access_log /var/log/nginx/epay-access.log epay_no_query;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location ^~ /api/public/payment-orders/ {
        limit_req zone=admin_api burst=60 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location = /snail-ai {
        return 302 /snail-ai/;
    }

    location ^~ /snail-ai/ {
        client_max_body_size 120m;
        client_body_timeout 300s;
        proxy_pass http://snailai:8900/snail-ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/snail/chat/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /prod-api/snail-chat {
        return 302 /prod-api/snail-chat/;
    }

    location ^~ /prod-api/snail-chat/ {
        proxy_pass http://backend:8080/snail-chat/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=admin_api burst=60 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location /pay/ {
        access_log /var/log/nginx/epay-access.log epay_no_query;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location /epay/ {
        access_log /var/log/nginx/epay-access.log epay_no_query;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location /actuator/ {
        return 403;
    }

    location /prod-api/ {
        limit_req zone=admin_api burst=60 nodelay;
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location = /index.html {
        try_files /index.html =404;
        expires -1;
        include /etc/nginx/snippets/security-headers-http.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location ~* \.(?:js|mjs|css|wasm|json|map|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/snippets/security-headers-http.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers-http.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
}
