name: payment-monitor-server
on:
  push:
  pull_request:
jobs:
  test-and-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -pl ruoyi-modules/ruoyi-payment -am -Dmaven.test.skip=false "-Dtest.groups=dev | integration" test
      - run: docker build -f deploy/production/backend.Dockerfile -t payment-monitor-backend:ci .
