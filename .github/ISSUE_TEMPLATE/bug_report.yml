name: 🐛 Bug 报告
description: 提交一个问题帮助改进 LuLuPay
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告这个问题！请尽量提供完整信息，方便我们快速定位。
  - type: dropdown
    id: component
    attributes:
      label: 组件
      description: 问题出现在哪个部分？
      options:
        - 后端服务 (payment-monitor-server)
        - 管理后台前端 (payment-monitor-admin)
        - Android 客户端 (payment-notification-monitor)
        - 部署 / Docker
        - 文档
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰描述你遇到的问题
      placeholder: 发生了什么？预期应该是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到报错...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 后端日志、错误信息或截图（如有）
      render: shell
  - type: input
    id: version
    attributes:
      label: 版本
      description: 使用的是什么版本？（commit hash 或 Release 版本）
      placeholder: "v1.0.1 / main@abc1234"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、JDK/Node/Docker 版本、数据库类型等
      placeholder: |
        - OS: Windows 11
        - JDK: 21
        - 数据库: PostgreSQL 17
        - 部署方式: Docker Compose
